<title>Astra Novum Peoples Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a war-room console. Controls strip on top, the map as the hero, a side ledger of peoples
   (right on wide screens, below on phones). The map well stays dark in both themes, like the game. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --line: #d3d8de;
  --fg: #182029;
  --muted: #5b6672;
  --accent: #1f7a8c;
  --accent-ink: #ffffff;
  --well: #070b12;
  --chip: #e3e7eb;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-data: "Share Tech Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --panel: #121922; --line: #243140; --fg: #dde5ec; --muted: #8a99a8;
    --accent: #4fc3d4; --accent-ink: #061015; --well: #04070b; --chip: #1b2531; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --panel: #121922; --line: #243140; --fg: #dde5ec; --muted: #8a99a8;
  --accent: #4fc3d4; --accent-ink: #061015; --well: #04070b; --chip: #1b2531; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px; box-sizing: border-box;
}
* { box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; margin-bottom: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: 0.02em; margin: 0; line-height: 1; text-wrap: balance; }
.sub { font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > .lbl { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button, .tog {
  font: 600 13px var(--font-body); color: var(--fg); background: transparent; border: 0; padding: 7px 12px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tog { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.tog[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tog .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
.tog[aria-pressed="true"] .dot { background: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
.well { position: relative; background: var(--well); border-radius: 8px; overflow: hidden; aspect-ratio: 2 / 1; max-width: 100%; touch-action: none; }
.well canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.well canvas.drag { cursor: grabbing; }
.hud { position: absolute; left: 10px; bottom: 8px; font-family: var(--font-data); font-size: 11px; color: #9fb3c4; pointer-events: none; text-shadow: 0 1px 2px #000; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #2b3a4a; background: rgba(10, 16, 24, 0.82); color: #dce6ee; font: 600 16px var(--font-body); cursor: pointer; }
.tip {
  position: absolute; pointer-events: none; min-width: 200px; max-width: 280px; background: rgba(8, 13, 20, 0.94); color: #e3ebf2;
  border: 1px solid #2b3a4a; border-radius: 6px; padding: 9px 10px; font-size: 12px; transform: translate(14px, 14px); z-index: 2;
}
.tip h3, .card h3 { font-family: var(--font-display); font-size: 17px; margin: 0; letter-spacing: 0.02em; }
.tip .rg, .card .rg { font-family: var(--font-data); font-size: 11px; color: #8fa4b6; margin: 2px 0 7px; }
.mix { display: grid; gap: 4px; }
.mixrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) 38px; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); }
.mixrow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mixrow .pc { font-family: var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: rgba(127,127,127,0.25); overflow: hidden; margin-top: -2px; }
.bar i { display: block; height: 100%; }

aside { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.card .rg { color: var(--muted); }
.card .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.chip { font-family: var(--font-data); font-size: 11px; background: var(--chip); border-radius: 4px; padding: 3px 6px; color: var(--fg); }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0; }
.ledger h2 { font-family: var(--font-display); font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
#q { width: 100%; font: 14px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; }
.list { max-height: 520px; overflow-y: auto; display: grid; gap: 2px; margin: 0 -4px; padding: 0 4px; }
.grp { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 5px; padding: 6px; color: var(--fg); font: 13px var(--font-body); cursor: pointer; }
.grp:hover { background: var(--chip); }
.grp[aria-pressed="true"] { background: var(--chip); box-shadow: inset 0 0 0 1px var(--accent); }
.grp .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp .n { font-family: var(--font-data); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fam { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
#sel .note { font-size: 13px; line-height: 1.45; margin: 6px 0 0; }
.facts2 { display: grid; gap: 5px; margin: 8px 0 4px; }
.fact { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; font-size: 13px; line-height: 1.35; }
.fact span { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; color: var(--muted); padding-top: 2px; }
.fact b { font-weight: 500; }
.legend-key { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.ramp { flex: 1; height: 8px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div>
    <h1>Peoples Atlas</h1>
    <div class="sub" id="subline">ASTRA NOVUM &middot; 2240 &middot; EARTH</div>
  </div>
  <div class="controls" role="toolbar" aria-label="Map controls">
    <div class="ctl"><span class="lbl">Planet</span>
      <div class="seg" id="bodySeg">
        <button type="button" id="b-earth" data-body="Earth" aria-pressed="true">Earth</button>
        <button type="button" id="b-mars" data-body="Mars" aria-pressed="false">Mars</button>
      </div>
    </div>
    <div class="ctl"><span class="lbl">Map</span>
      <div class="seg" id="layerSeg">
        <button type="button" id="l-eth" data-layer="ethnicity" aria-pressed="true">Ethnicity</button>
        <button type="button" id="l-reg" data-layer="regions" aria-pressed="false">Regions</button>
        <button type="button" id="l-sat" data-layer="satellite" aria-pressed="false">Satellite</button>
      </div>
    </div>
    <div class="ctl"><span class="lbl">Borders</span>
      <button type="button" class="tog" id="t-prov" aria-pressed="true"><span class="dot"></span>Provinces</button>
      <button type="button" class="tog" id="t-reg" aria-pressed="true"><span class="dot"></span>Regions</button>
      <button type="button" class="tog" id="t-lab" aria-pressed="true"><span class="dot"></span>Names</button>
    </div>
  </div>
</header>

<main>
  <div>
    <div class="well" id="well">
      <canvas id="map" aria-label="Map of the peoples of the selected planet"></canvas>
      <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button><button type="button" id="zreset" aria-label="Reset view">&#10226;</button></div>
      <div class="hud" id="hud">Loading maps&hellip;</div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </div>
  <aside>
    <div class="card" id="pin">
      <p class="hint">Hover a province to see who lives there. Click it to pin it here. Drag to move, scroll or use the buttons to zoom.</p>
    </div>
    <div class="card" id="sel" hidden></div>
    <div class="card ledger">
      <h2 id="ledgerTitle">Peoples</h2>
      <input id="q" type="search" placeholder="Find a people or language, e.g. Sibiryaks" aria-label="Find a people">
      <div class="list" id="list"></div>
    </div>
  </aside>
</main>

<script>
(() => {
  const W = 2048, H = 1024;
  const $ = (id) => document.getElementById(id);
  const state = { body: 'Earth', layer: 'ethnicity', prov: true, reg: true, labels: true, group: null, hover: 0, pinned: 0,
                  scale: 1, ox: 0, oy: 0 };
  let DATA = null;
  const bodies = {};   // per body: images, ids, edges, region centroids, composed canvas

  const loadImg = (src) => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
  const pixels = (img) => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, W, H); return x.getImageData(0, 0, W, H); };
  const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function regionColour(id) {
    const h = (id * 0.61803398875 + 0.07) % 1;
    const f = (n) => { const k = (n + h * 6) % 6; return 1 - Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map((v) => Math.round((0.35 + 0.5 * v) * 255));
  }

  async function prepare(name) {
    if (bodies[name]) return bodies[name];
    const low = name.toLowerCase();
    const [eth, sat, ids] = await Promise.all([loadImg(low + '_ethnicity.jpg'), loadImg(low + '_satellite.jpg'), loadImg(low + '_ids.png')]);
    const B = { eth: pixels(eth), sat: pixels(sat), info: DATA.bodies[name] };
    const ip = pixels(ids).data;
    const id = new Uint32Array(W * H);
    for (let i = 0, p = 0; i < W * H; i++, p += 4) id[i] = ip[p] | (ip[p + 1] << 8) | (ip[p + 2] << 16);
    B.id = id;
    const reg = new Int16Array(W * H).fill(-1);
    for (let i = 0; i < W * H; i++) { const pr = B.info.provinces[id[i]]; if (id[i] && pr) reg[i] = pr.region; }
    B.reg = reg;
    // Borders: a pixel is on a border when its right or lower neighbour differs (wraps in longitude).
    const pe = new Uint8Array(W * H), re = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x; if (!id[i]) continue;
      const r = y * W + ((x + 1) % W), d = y < H - 1 ? i + W : i;
      for (const j of [r, d]) {
        if (id[j] && id[j] !== id[i]) { pe[i] = 1; pe[j] = 1; }
        if (reg[j] >= 0 && reg[j] !== reg[i]) { re[i] = 1; re[j] = 1; }
      }
    }
    // Thicken region borders by one pixel.
    const re2 = new Uint8Array(re);
    for (let y = 1; y < H - 1; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (re[i]) { re2[i - W] = 1; re2[i + W] = 1; re2[y * W + (x + 1) % W] = 1; } }
    B.pe = pe; B.re = re2;
    // Label anchors: the pixel nearest each region's / province's centre of mass (on a circle in longitude).
    const acc = (keyOf) => { const m = new Map(); for (let i = 0; i < W * H; i += 3) { const k = keyOf(i); if (k == null) continue; const x = i % W, y = (i / W) | 0; const a = x / W * 2 * Math.PI; let e = m.get(k); if (!e) { e = [0, 0, 0, 0]; m.set(k, e); } e[0] += Math.cos(a); e[1] += Math.sin(a); e[2] += y; e[3]++; } const out = []; for (const [k, e] of m) { let a = Math.atan2(e[1], e[0]); if (a < 0) a += 2 * Math.PI; out.push({ k, x: a / (2 * Math.PI) * W, y: e[2] / e[3], n: e[3] }); } return out; };
    B.regLabels = acc((i) => (B.reg[i] >= 0 ? B.reg[i] : null));
    B.provLabels = acc((i) => (id[i] ? id[i] : null));
    B.canvas = document.createElement('canvas'); B.canvas.width = W; B.canvas.height = H;
    bodies[name] = B;
    return B;
  }

  // Compose the chosen map, borders and highlight into one W x H image.
  function compose() {
    const B = bodies[state.body]; if (!B) return;
    const ctx = B.canvas.getContext('2d');
    const out = ctx.createImageData(W, H), o = out.data;
    const base = state.layer === 'satellite' ? B.sat.data : B.eth.data;
    const sat = B.sat.data;
    let share = null, gc = null;
    if (state.group) {
      share = new Float32Array(65536);
      for (const [pid, p] of Object.entries(B.info.provinces)) for (const [k, v] of (p.mix || [])) if (k === state.group) share[pid] = v / 100;
      gc = hexRgb(DATA.groups[state.group].color);
    }
    const regCols = {};
    for (let i = 0, p = 0; i < W * H; i++, p += 4) {
      let r = base[p], g = base[p + 1], b = base[p + 2];
      const pid = B.id[i];
      if (state.layer === 'regions') {
        if (pid) {
          const rg = B.reg[i]; const c = regCols[rg] || (regCols[rg] = regionColour(rg));
          const l = (sat[p] * 0.3 + sat[p + 1] * 0.59 + sat[p + 2] * 0.11) / 255;
          const k = 0.72 + 0.5 * l; r = c[0] * k; g = c[1] * k; b = c[2] * k;
        } else { r = 10; g = 18; b = 30; }
      }
      if (share && pid) {
        const s = share[pid] || 0;
        if (s > 0) { const a = 0.35 + 0.65 * Math.min(1, s * 1.6); r = r * (1 - a) + gc[0] * a; g = g * (1 - a) + gc[1] * a; b = b * (1 - a) + gc[2] * a; }
        else { r *= 0.28; g *= 0.28; b *= 0.32; }
      }
      if (pid && state.prov && B.pe[i]) { r *= 0.55; g *= 0.55; b *= 0.55; }
      if (state.reg && B.re[i]) { r = 12; g = 14; b = 18; }
      if (state.pinned && pid === state.pinned) { r = r * 0.6 + 255 * 0.4; g = g * 0.6 + 230 * 0.4; b = b * 0.6 + 140 * 0.4; }
      o[p] = r; o[p + 1] = g; o[p + 2] = b; o[p + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    draw();
  }

  // ---- view -------------------------------------------------------------------------------------
  const cv = $('map'), well = $('well');
  function fit() { const r = well.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); draw(); }
  const baseScale = () => cv.width / W;
  function clampView() {
    const s = baseScale() * state.scale; const h = H * s;
    state.oy = Math.min(0, Math.max(cv.height - h, state.oy));
    const w = W * s; state.ox = ((state.ox % w) + w) % w - w;
  }
  function draw() {
    const B = bodies[state.body]; const x = cv.getContext('2d');
    x.fillStyle = '#04070b'; x.fillRect(0, 0, cv.width, cv.height);
    if (!B) return;
    clampView();
    const s = baseScale() * state.scale, w = W * s;
    x.imageSmoothingEnabled = state.scale < 2.5;
    for (let ox = state.ox; ox < cv.width; ox += w) x.drawImage(B.canvas, ox, state.oy, w, H * s);
    if (state.labels) drawLabels(x, B, s, w);
    if (state.hover) outline(x, B, s, w);
    $('hud').textContent = `zoom \u00d7${state.scale.toFixed(1)} \u00b7 ${Object.keys(B.info.provinces).length} provinces \u00b7 ${Object.keys(B.info.regions).length} regions`;
  }
  function drawLabels(x, B, s, w) {
    const d = window.devicePixelRatio || 1;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    const put = (list, text, size, colour, minPx) => {
      x.font = `600 ${size * d}px "Barlow Condensed", "Arial Narrow", sans-serif`;
      for (const L of list) {
        if (Math.sqrt(L.n * 3) * s < minPx * d) continue;
        const t = text(L.k); if (!t) continue;
        for (let ox = state.ox; ox < cv.width + w; ox += w) {
          const px = ox + L.x * s, py = state.oy + L.y * s;
          if (px < -200 || px > cv.width + 200 || py < 0 || py > cv.height) continue;
          x.lineWidth = 3 * d; x.strokeStyle = 'rgba(4,7,11,0.85)'; x.strokeText(t, px, py);
          x.fillStyle = colour; x.fillText(t, px, py);
        }
      }
    };
    const R = B.info.regions, P = B.info.provinces;
    if (state.scale < 3.2) put(B.regLabels, (k) => (R[k] || '').toUpperCase(), Math.min(15, 9 + state.scale * 2), '#f2f5f7', 26);
    if (state.scale >= 2.2) put(B.provLabels, (k) => (P[k] ? P[k].name : ''), Math.min(13, 6 + state.scale * 1.4), '#cfe3ee', 34);
  }
  function outline(x, B, s, w) {
    // Draw the hovered province's border pixels brightly (cheap: scan its bounding box once).
    if (!B.box) B.box = {};
    let bb = B.box[state.hover];
    if (!bb) { let x0 = W, x1 = 0, y0 = H, y1 = 0; for (let i = 0; i < W * H; i++) if (B.id[i] === state.hover) { const px = i % W, py = (i / W) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; } bb = B.box[state.hover] = [x0, y0, x1, y1]; }
    x.fillStyle = '#ffe28a';
    const sz = Math.max(1, s);
    for (let y = bb[1]; y <= bb[3]; y++) for (let px = bb[0]; px <= bb[2]; px++) {
      const i = y * W + px; if (B.id[i] !== state.hover) continue;
      const edge = B.id[y * W + (px + 1) % W] !== state.hover || B.id[y * W + (px - 1 + W) % W] !== state.hover || (y > 0 && B.id[i - W] !== state.hover) || (y < H - 1 && B.id[i + W] !== state.hover);
      if (!edge) continue;
      for (let ox = state.ox; ox < cv.width; ox += w) x.fillRect(ox + px * s, state.oy + y * s, sz, sz);
    }
  }
  function mapAt(ev) {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    const cx = (ev.clientX - r.left) * d, cy = (ev.clientY - r.top) * d;
    const s = baseScale() * state.scale;
    let mx = Math.floor((cx - state.ox) / s) % W; if (mx < 0) mx += W;
    const my = Math.floor((cy - state.oy) / s);
    return { mx, my, cx: ev.clientX - r.left, cy: ev.clientY - r.top };
  }
  function zoomAt(f, cx, cy) {
    const old = state.scale; state.scale = Math.max(1, Math.min(14, old * f));
    const k = state.scale / old; state.ox = cx - (cx - state.ox) * k; state.oy = cy - (cy - state.oy) * k; draw();
  }

  // ---- panels -----------------------------------------------------------------------------------
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function mixHtml(mix) {
    return '<div class="mix">' + (mix || []).map(([k, v]) => {
      const g = DATA.groups[k]; const c = g ? g.color : '#777'; const n = g ? g.name : 'Others';
      return `<div class="mixrow"><span class="sw" style="background:${c}"></span><span class="nm">${esc(n)}</span><span class="pc">${v}%</span><span class="bar"><i style="width:${v}%;background:${c}"></i></span></div>`;
    }).join('') + '</div>';
  }
  function provHtml(pid, card) {
    const B = bodies[state.body]; const p = B.info.provinces[pid]; if (!p) return '';
    const facts = card ? `<div class="facts">${p.terrain ? `<span class="chip">${esc(p.terrain)}</span>` : ''}${p.climate ? `<span class="chip">${esc(p.climate)}</span>` : ''}${p.area ? `<span class="chip">${p.area.toLocaleString()} km\u00b2</span>` : ''}</div>` : '';
    return `<h3>${esc(p.name)}</h3><div class="rg">${esc(B.info.regions[p.region] || '')} \u00b7 province ${pid}</div>${mixHtml(p.mix)}${facts}`;
  }
  function renderPin() {
    $('pin').innerHTML = state.pinned ? provHtml(state.pinned, true) + '<p class="hint" style="margin-top:8px">Click elsewhere to pin another, or the same province to let go.</p>'
      : '<p class="hint">Hover a province to see who lives there. Click it to pin it here. Drag to move, scroll or use the buttons to zoom.</p>';
  }
  function renderSel() {
    const el = $('sel');
    if (!state.group) { el.hidden = true; return; }
    const g = DATA.groups[state.group]; const B = bodies[state.body];
    const where = Object.entries(B.info.provinces).map(([id, p]) => [p, ((p.mix || []).find(([k]) => k === state.group) || [0, 0])[1]]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const top = where.slice(0, 6).map(([p, v]) => `<div class="mixrow"><span class="sw" style="background:${g.color}"></span><span class="nm">${esc(p.name)}</span><span class="pc">${v}%</span></div>`).join('');
    const fmtPop = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + ' billion' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' million' : Math.round(n / 1e3) + ' thousand';
    const facts = [['Population', g.pop ? fmtPop(g.pop) : '\u2013'], ['Language', g.language], ['Faith', g.faith], g.parents ? ['Born from', g.parents] : null, ['Strongholds', g.strong]].filter(Boolean)
      .map(([k, v]) => `<div class="fact"><span>${k}</span><b>${esc(v || '\u2013')}</b></div>`).join('');
    el.innerHTML = `<h3>${esc(g.name)}</h3><div class="rg fam">${esc(g.family)} \u00b7 in ${where.length} provinces on ${state.body}</div><div class="facts2">${facts}</div><p class="note">${esc(g.note)}</p>
      <div class="legend-key"><span>few</span><span class="ramp" style="background:linear-gradient(90deg, #262b33, ${g.color})"></span><span>most</span></div>
      <div class="mix" style="margin-top:10px">${top}</div>
      <p class="hint" style="margin-top:8px">Strongest provinces first. Click the people again to clear.</p>`;
    el.hidden = false;
  }
  function renderList() {
    const B = bodies[state.body]; if (!B) return;
    const count = {};
    for (const p of Object.values(B.info.provinces)) for (const [k, v] of (p.mix || [])) if (k !== 'other') { count[k] = (count[k] || 0) + v; }
    const q = $('q').value.trim().toLowerCase();
    const keys = Object.keys(count).filter((k) => DATA.groups[k] && (!q || DATA.groups[k].name.toLowerCase().includes(q) || DATA.groups[k].family.toLowerCase().includes(q) || (DATA.groups[k].language || '').toLowerCase().includes(q))).sort((a, b) => (DATA.groups[b].pop || count[b]) - (DATA.groups[a].pop || count[a]));
    $('ledgerTitle').textContent = `Peoples of ${state.body} \u00b7 ${Object.keys(count).length}`;
    $('list').innerHTML = keys.map((k) => { const g = DATA.groups[k]; const n = Object.values(B.info.provinces).filter((p) => (p.mix || []).some(([kk]) => kk === k)).length;
      const pp = g.pop >= 1e9 ? (g.pop / 1e9).toFixed(1) + ' bn' : g.pop >= 1e6 ? Math.round(g.pop / 1e6) + ' m' : Math.round((g.pop || 0) / 1e3) + ' k';
      return `<button type="button" class="grp" data-k="${k}" aria-pressed="${state.group === k}"><span class="sw" style="background:${g.color}"></span><span class="nm">${esc(g.name)}<br><span class="fam">${esc(g.family)} \u00b7 ${n} prov.</span></span><span class="n">${pp}</span></button>`; }).join('') || '<p class="hint">No people matches that name.</p>';
  }

  // ---- events -----------------------------------------------------------------------------------
  let drag = null, moved = false;
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, ox: state.ox, oy: state.oy }; moved = false; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', (e) => {
    const d = window.devicePixelRatio || 1;
    if (drag) { const dx = (e.clientX - drag.x) * d, dy = (e.clientY - drag.y) * d; if (Math.abs(dx) + Math.abs(dy) > 4) moved = true; state.ox = drag.ox + dx; state.oy = drag.oy + dy; draw(); }
    const B = bodies[state.body]; if (!B) return;
    const { mx, my, cx, cy } = mapAt(e);
    const pid = my >= 0 && my < H ? B.id[my * W + mx] : 0;
    if (pid !== state.hover) { state.hover = pid; draw(); }
    const tip = $('tip');
    if (pid && !drag && B.info.provinces[pid]) { tip.innerHTML = provHtml(pid, false); tip.hidden = false;
      const r = well.getBoundingClientRect(); const flipX = cx > r.width - 300, flipY = cy > r.height - 180;
      tip.style.left = cx + 'px'; tip.style.top = cy + 'px'; tip.style.transform = `translate(${flipX ? 'calc(-100% - 14px)' : '14px'}, ${flipY ? 'calc(-100% - 14px)' : '14px'})`; }
    else tip.hidden = true;
  });
  cv.addEventListener('pointerup', (e) => {
    cv.classList.remove('drag');
    if (drag && !moved) { const B = bodies[state.body]; const { mx, my } = mapAt(e); const pid = my >= 0 && my < H ? B.id[my * W + mx] : 0;
      state.pinned = pid && pid !== state.pinned ? pid : 0; renderPin(); compose(); }
    drag = null;
  });
  cv.addEventListener('pointerleave', () => { $('tip').hidden = true; if (state.hover) { state.hover = 0; draw(); } });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; zoomAt(e.deltaY < 0 ? 1.25 : 0.8, (e.clientX - r.left) * d, (e.clientY - r.top) * d); }, { passive: false });
  $('zin').onclick = () => zoomAt(1.5, cv.width / 2, cv.height / 2);
  $('zout').onclick = () => zoomAt(1 / 1.5, cv.width / 2, cv.height / 2);
  $('zreset').onclick = () => { state.scale = 1; state.ox = 0; state.oy = 0; draw(); };

  const press = (seg, attr, val) => seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === val)));
  $('bodySeg').addEventListener('click', async (e) => { const b = e.target.closest('button'); if (!b) return; state.body = b.dataset.body; press($('bodySeg'), 'body', state.body);
    state.pinned = 0; state.hover = 0; if (state.group && !DATA.groups[state.group].bodies.includes(state.body)) state.group = null;
    $('subline').textContent = `ASTRA NOVUM \u00b7 2240 \u00b7 ${state.body.toUpperCase()}`; $('hud').textContent = 'Loading\u2026'; await prepare(state.body); renderPin(); renderSel(); renderList(); compose(); });
  $('layerSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.layer = b.dataset.layer; press($('layerSeg'), 'layer', state.layer); compose(); });
  for (const [id, key] of [['t-prov', 'prov'], ['t-reg', 'reg'], ['t-lab', 'labels']]) $(id).onclick = () => { state[key] = !state[key]; $(id).setAttribute('aria-pressed', String(state[key])); key === 'labels' ? draw() : compose(); };
  $('list').addEventListener('click', (e) => { const b = e.target.closest('.grp'); if (!b) return; state.group = state.group === b.dataset.k ? null : b.dataset.k; renderList(); renderSel(); compose(); });
  $('q').addEventListener('input', renderList);
  new ResizeObserver(fit).observe(well);

  (async () => {
    try {
      DATA = await (await fetch('data.json')).json();
      await prepare('Earth');
      fit(); renderList(); compose();
    } catch (err) { $('hud').textContent = 'The map files did not load. Reload the page to try again.'; }
  })();
})();
</script>
